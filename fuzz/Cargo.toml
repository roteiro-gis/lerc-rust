[package]
name = "lerc-rust-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = ["dep:libfuzzer-sys"]

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
lerc-core = { path = "../lerc-core" }
lerc-reader = { path = "../lerc-reader" }
lerc-writer = { path = "../lerc-writer" }

[[bin]]
name = "headers"
path = "fuzz_targets/headers.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "mask_rle"
path = "fuzz_targets/mask_rle.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "huffman_tables"
path = "fuzz_targets/huffman_tables.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "bitstuff_blocks"
path = "fuzz_targets/bitstuff_blocks.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "lerc2_bitstuff_blocks"
path = "fuzz_targets/lerc2_bitstuff_blocks.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "concatenated"
path = "fuzz_targets/concatenated.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]

[[bin]]
name = "encode_roundtrip"
path = "fuzz_targets/encode_roundtrip.rs"
test = false
doc = false
bench = false
required-features = ["fuzzing"]
