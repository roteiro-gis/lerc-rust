test = false
doc = false
bench = false

[[bin]]
name = "bitstuff_blocks"
path = "fuzz_targets/bitstuff_blocks.rs"
test = false
doc = false
bench = false

[[bin]]
name = "concatenated"
path = "fuzz_targets/concatenated.rs"
test = false
doc = false
bench = false
