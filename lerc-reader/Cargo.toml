[package]
name = "lerc-reader"
description = "Pure-Rust decoder for the LERC raster compression format"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/lerc-reader"
keywords = ["lerc", "raster", "compression", "gis", "geospatial"]
categories = ["compression", "science"]
exclude = ["benches/**", "tests/**"]

[lints]
workspace = true

[features]
default = ["ndarray"]
ndarray = ["dep:ndarray"]
rayon = ["dep:rayon"]

[dependencies]
lerc-core = { version = "0.5.0", path = "../lerc-core" }
ndarray = { workspace = true, optional = true }
rayon = { version = "=1.10.0", optional = true }

[dev-dependencies]
clap.workspace = true # Criterion transitive MSRV anchor.
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "reference_compare_bench"
harness = false
