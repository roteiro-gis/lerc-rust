[package]
name = "lerc-writer"
description = "Pure-Rust Lerc2 encoder for single blobs and concatenated band sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/lerc-writer"
keywords = ["lerc", "raster", "compression", "gis", "geospatial"]
categories = ["compression", "science"]
exclude = ["benches/**", "tests/**"]

[lints]
workspace = true

[dependencies]
lerc-core = { version = "0.5.0", path = "../lerc-core" }

[dev-dependencies]
clap.workspace = true # Criterion transitive MSRV anchor.
criterion = "0.5"
lerc-reader = { version = "0.5.0", path = "../lerc-reader" }
ndarray = { workspace = true }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }
serde_json = "1"

[[bench]]
name = "encode_bench"
harness = false
