[package]
name = "lerc-writer"
description = "Pure-Rust Lerc2 encoder for single blobs and concatenated band sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/lerc-writer"
keywords = ["lerc", "raster", "compression", "gis", "geospatial"]
categories = ["compression", "science"]

[dependencies]
lerc-core = { version = "0.4.3", path = "../lerc-core" }

[dev-dependencies]
criterion = "0.5"
lerc-reader = { version = "0.4.3", path = "../lerc-reader" }
ndarray = { workspace = true }
serde_json = "1"

[[bench]]
name = "encode_bench"
harness = false
