name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt,clippy --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Test minimal reader features
        run: cargo test -p lerc-reader --no-default-features --locked

      - name: Test Rayon without ndarray
        run: cargo test -p lerc-reader --no-default-features --features rayon --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.77
        run: rustup toolchain install 1.77.0 --profile minimal --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run locked workspace tests
        run: cargo +1.77.0 test --workspace --all-features --locked

      - name: Guard dependency MSRV drift
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo update
          cargo +1.77.0 check --workspace --all-targets

  miri:
    name: Miri
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri,rust-src --no-self-update

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run Miri tests
        run: rustup run nightly cargo miri test -p lerc-reader --lib --locked

  platforms:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
      - name: Test all features
        run: cargo test --workspace --all-features --locked

  big-endian:
    name: Big-endian s390x
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup toolchain install 1.91.0 --profile minimal --no-self-update
      - uses: taiki-e/install-action@cross
      - uses: Swatinem/rust-cache@v2
      - name: Test under s390x emulation
        run: cross test --workspace --target s390x-unknown-linux-gnu --locked

  security:
    name: Dependencies
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-audit
          fallback: none
      - name: Audit Rust dependencies
        run: cargo audit --deny warnings

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust with LLVM tools
        run: rustup toolchain install 1.91.0 --profile minimal --component llvm-tools-preview --no-self-update
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Generate LCOV
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info --locked
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '60' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - headers
          - mask_rle
          - huffman_tables
          - bitstuff_blocks
          - lerc2_bitstuff_blocks
          - concatenated
          - encode_roundtrip

    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          rustup toolchain install nightly --profile minimal --no-self-update
      - name: Install cargo-fuzz
        env:
          RUSTFLAGS: ""
        run: cargo +1.91.0 install cargo-fuzz --version 0.13.1 --locked
      - uses: Swatinem/rust-cache@v2
      - name: Verify headers corpus regressions
        if: matrix.target == 'headers'
        run: cargo +1.91.0 test --manifest-path fuzz/Cargo.toml --no-default-features --locked
      - name: Run smoke fuzzing
        run: cargo +nightly fuzz run "${{ matrix.target }}" -- -max_total_time="${FUZZ_SECONDS}" -dict=fuzz/dictionaries/lerc.dict
